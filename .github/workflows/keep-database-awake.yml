# Supabase's free plan pauses a project after a week with no activity.
# This reads one event every few days (with the public key from .env) so the
# database stays awake between track weekends.
name: Keep database awake

on:
  schedule:
    - cron: '17 13 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read one event
        run: |
          set -a; . ./.env; set +a
          curl --fail --silent --show-error --retry 3 \
            -H "apikey: $EXPO_PUBLIC_SUPABASE_KEY" \
            "$EXPO_PUBLIC_SUPABASE_URL/rest/v1/events?select=id&limit=1"
