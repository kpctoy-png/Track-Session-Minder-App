# On track weekends, checks every 10 minutes that drivers can still reach the app:
# the website loads, the database answers, and today's schedule is there.
# A failed run means drivers may be stuck; the log says which check failed.
# Uses only the public key from .env and prints no driver details.
name: Event watchdog

on:
  schedule:
    - cron: '*/10 10-23 * * 5,6,0'
  workflow_dispatch:
    inputs:
      date:
        description: 'Check this day instead of today (YYYY-MM-DD), for a dry run'
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the app and today's schedule
        env:
          DATE: ${{ inputs.date }}
        run: |
          set -a; . ./.env; set +a
          today="${DATE:-$(TZ=America/New_York date +%F)}"
          api() { curl --fail --silent --show-error --retry 3 --max-time 20 -H "apikey: $EXPO_PUBLIC_SUPABASE_KEY" "$EXPO_PUBLIC_SUPABASE_URL/rest/v1/$1"; }

          days=$(api "event_days?select=id,label,date,updated_at,items,events(name)&date=eq.$today")
          count=$(echo "$days" | jq length)
          if [ "$count" = 0 ]; then echo "No event today ($today). Nothing to watch."; exit 0; fi

          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 3 --max-time 20 https://kpctoy-png.github.io/Track-Session-Minder-App/)
          echo "Website: HTTP $code"
          [ "$code" = 200 ] || { echo "::error::The app website is not loading (HTTP $code)."; exit 1; }

          echo "$days" | jq -r '.[] | "\(.events.name) \(.label): \(.items | length) sessions, last changed \(.updated_at)"'
          empty=$(echo "$days" | jq '[.[] | select((.items | length) == 0)] | length')
          [ "$empty" = 0 ] || { echo "::error::Today's schedule has a day with no sessions."; exit 1; }

          live=$(api "announcements?select=id&cleared_at=is.null" | jq length)
          echo "Announcements up: $live"
